name: Swing Scanner + Backtest

on:
  schedule:
    - cron: "45 10 * * 1-5"   # Mon-Fri 4:15 PM IST (market close ke baad)
  workflow_dispatch:           # Actions tab se manually bhi chala sakte ho

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Price data cache: har baar pura 3 saal download nahi hoga
      - uses: actions/cache@v4
        with:
          path: data/prices.pkl
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run scanner + backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_backtest.py

      - name: Results repo mein save karo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add output/ data/nifty500.csv
          git commit -m "Scan results $(date +'%Y-%m-%d')" || echo "No changes"
          git push
